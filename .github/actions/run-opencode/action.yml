name: Run OpenCode AI
description: Run OpenCode for AI-powered review or triage

inputs:
  task-type:
    description: Task type (review or triage)
    required: true
  model:
    description: OpenCode model to use
    default: ${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}
  prompt:
    description: Custom prompt file path (optional)
    required: false
  timeout-minutes:
    description: Timeout in minutes
    default: "10"

runs:
  using: composite
  steps:
    - name: Run OpenCode AI
      uses: anomalyco/opencode/github@8c8011336163d7e7fb24a6a4a049cdb1f6e6ee74 # v1.17.3
      timeout-minutes: ${{ inputs.timeout-minutes }}
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      with:
        share: true
        use_github_token: true
        model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}