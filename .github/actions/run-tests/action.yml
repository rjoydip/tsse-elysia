name: Run Tests
description: Run unit tests with optional coverage

inputs:
  coverage:
    description: Enable coverage reporting
    default: "false"
  coverage-format:
    description: Coverage format (lcov, json, text)
    default: "lcov"
  coverage-token:
    description: Codecov token (optional)
    required: false

runs:
  using: composite
  steps:
    - name: Run tests
      shell: bash
      run: |
        if [ "${{ inputs.coverage }}" = "true" ]; then
          bun test:coverage --run --coverage-reporter=${{ inputs.coverage-format }}
        else
          bun test
        fi

    - name: Upload to Codecov
      if: inputs.coverage == 'true' && inputs.coverage-token != ''
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: true
        token: ${{ inputs.coverage-token }}