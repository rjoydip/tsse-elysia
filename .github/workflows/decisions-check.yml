name: Enforce Decisions Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-decisions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-branch-tags: true

      - name: Get base branch
        id: branch
        run: |
          BASE_BRANCH=${GITHUB_BASE_REF#refs/heads/}
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=main
          fi
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Check if critical files changed
        id: critical
        run: |
          BASE_BRANCH=${{ steps.branch.outputs.BASE_BRANCH }}

          # Check if origin remote exists and has the branch
          if git remote get-url origin >/dev/null 2>&1; then
            # Ensure branch is fetched for diff
            git fetch origin "${BASE_BRANCH}" --depth=1 2>/dev/null || true
            CHANGED_FILES=$(git diff --name-only "origin/${BASE_BRANCH}"...HEAD 2>/dev/null || true)
          else
            # Fallback: use first branch found in repo or main
            FALLBACK_BRANCH=$(git branch -r --format='%(refname:short)' | head -1 | sed 's|^origin/||' || echo "main")
            CHANGED_FILES=$(git diff --name-only "${FALLBACK_BRANCH}"...HEAD 2>/dev/null || git diff --name-only HEAD~1..HEAD 2>/dev/null || true)
          fi

          echo "Changed files: $CHANGED_FILES"

          # Pattern for critical files that require DECISIONS.md update
          CRITICAL_PATTERN="\.github/workflows|src/lib/db|src/lib/redis|mcp|scripts/"

          if echo "$CHANGED_FILES" | grep -qE "$CRITICAL_PATTERN"; then
            echo "CRITICAL=true" >> $GITHUB_OUTPUT
          else
            echo "CRITICAL=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify DECISIONS.md updated
        if: steps.critical.outputs.CRITICAL == 'true'
        run: |
          BASE_BRANCH=${{ steps.branch.outputs.BASE_BRANCH }}

          # Reuse diff result if available, otherwise recalculate
          if git remote get-url origin >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only "origin/${BASE_BRANCH}"...HEAD 2>/dev/null || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || git diff --name-only || true)
          fi

          if echo "$CHANGED_FILES" | grep -q "knowledge/DECISIONS.md"; then
            echo "✅ Architecture change properly documented"
          else
            echo "❌ You changed architecture but didn't update knowledge/DECISIONS.md"
            echo "Changed files: $CHANGED_FILES"
            exit 1
          fi