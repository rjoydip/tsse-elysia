name: Enforce Decisions Log

on:
  pull_request:
    paths:
      - "package.json"
      - "src/**"
      - "mcp/**"

jobs:
  check-decisions:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base branch
        run: |
          BASE_BRANCH=${{ github.base_ref }}
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Check if critical files changed
        id: critical
        run: |
          if git diff --name-only origin/${{ steps.changes.outputs.BASE_BRANCH }}...HEAD | grep -qE "(package\.json|src/lib/db|src/lib/redis|mcp)"; then
            echo "CRITICAL=true" >> $GITHUB_OUTPUT
          else
            echo "CRITICAL=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify DECISIONS.md updated
        if: steps.critical.outputs.CRITICAL == 'true'
        run: |
          if ! git diff --name-only origin/${{ steps.changes.outputs.BASE_BRANCH }}...HEAD | grep -q "knowledge/DECISIONS.md"; then
            echo "❌ You changed architecture but didn't update knowledge/DECISIONS.md"
            exit 1
          fi
        shell: bash