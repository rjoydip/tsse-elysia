name: Enforce Decisions Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-decisions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-branch-tags: true

      - name: Get base branch
        id: branch
        run: |
          BASE_BRANCH=${GITHUB_BASE_REF#refs/heads/}
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=main
          fi
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Check if critical files changed
        id: critical
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ steps.branch.outputs.BASE_BRANCH }}...HEAD || true)
          echo "Changed files: $CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -qE "(\.github/workflows|src/lib/db|src/lib/redis|mcp|scripts/)"; then
            echo "CRITICAL=true" >> $GITHUB_OUTPUT
          else
            echo "CRITICAL=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify DECISIONS.md updated
        if: steps.critical.outputs.CRITICAL == 'true'
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ steps.branch.outputs.BASE_BRANCH }}...HEAD || true)
          if echo "$CHANGED_FILES" | grep -q "knowledge/DECISIONS.md"; then
            echo "✅ Architecture change properly documented"
          else
            echo "❌ You changed architecture but didn't update knowledge/DECISIONS.md"
            echo "Changed files: $CHANGED_FILES"
            exit 1
          fi