name: Sync TASKS.md with Issues

on:
  push:
    branches:
      - main
    paths:
      - "knowledge/TASKS.md"

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Extract tasks
        run: bun scripts/sync-tasks.ts

      - name: Validate GitHub token
        run: |
          if [ -z "${{ secrets.GH_TOKEN_CHANGESET }}" ]; then
            echo "❌ GH_TOKEN_CHANGESET secret is not set"
            exit 1
          fi
          echo "✅ GitHub token is configured"

      - name: Create issues for tasks without issue numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CHANGESET }}
        run: |
          set -e
          TASKS_FILE="knowledge/TASKS.md"

          if [ ! -f "$TASKS_FILE" ]; then
            echo "❌ TASKS.md not found"
            exit 1
          fi

          # Find tasks with <!-- issue: # --> format (space before -->)
          TASKS=$(grep "<!-- issue: # -->" "$TASKS_FILE" || true)

          if [ -z "$TASKS" ]; then
            echo "✅ No new tasks requiring issues"
            exit 0
          fi

          echo "$TASKS" | while read line; do
            TITLE=$(echo "$line" | sed 's/- \[ \] //g' | sed 's/<!--.*-->//g' | xargs)
            if [ -n "$TITLE" ]; then
              gh issue create \
                --title "$TITLE" \
                --body "Auto-created from TASKS.md" \
                --label "auto-created"
              echo "✅ Created issue: $TITLE"
            fi
          done

          echo "✅ Task issue creation complete"