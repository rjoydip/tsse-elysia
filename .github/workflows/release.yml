name: Release

on:
  push:
    tags:
      - "v*"

# =============================================================================
# Release Workflow
# =============================================================================
# Triggers:
#   - Push of version tag (e.g., v1.2.3) - triggers release
#
# Process:
#   1. Tag pushed (from ci.yml create-release job)
#   2. Create GitHub release with changelog using changelogen
#
# Note:
#   - Version bump, CHANGELOG.md update, and tag creation handled by ci.yml
#   - NPM publishing is commented out for reference - not enabled
# =============================================================================

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Create GitHub Release (triggers on tag push)
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Get Tag Name
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Releasing: $TAG_NAME"

      - name: Create GitHub Release with Changelogen
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          VERSION="${TAG#v}"
          CHANGELOG=$(bun changelogen --output - 2>/dev/null || echo "")

          # Create release using GitHub CLI
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$CHANGELOG" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

