name: Release

# =============================================================================
# Release Workflow
# =============================================================================
# Triggers:
#   - Push to main branch (automatic)
#   - Manual workflow_dispatch
#
# Process:
#   1. Validate working tree (no uncommitted changes)
#   2. Run quality checks (lint, typecheck, tests)
#   3. Run security audit
#   4. Build application
#   5. Version bump with changelogen
#   6. Create Git tag and release with changelogithub
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Manual version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (skip publishing)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ~/.bun-install-cache

jobs:
  # ---------------------------------------------------------------------------
  # Pre-release Validations
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has-changes }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      - uses: ./.github/actions/setup-environment
        with:
          fetch-depth: "0"

      - name: Check working tree status
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Working tree is not clean. Please commit or stash changes."
            git status
            exit 1
          fi
          echo "✅ Working tree is clean"

      - name: Check for changes to release
        id: check_changes
        run: |
          # Check if there are conventional commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            # No tags yet, check all commits
            COMMITS=$(git log --oneline -1 2>/dev/null || echo "")
          else
            COMMITS=$(git log --oneline "$LAST_TAG"..HEAD 2>/dev/null || echo "")
          fi
          if [[ -n "$COMMITS" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changes found to release"
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No changes found to release"
          fi

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

  # ---------------------------------------------------------------------------
  # Quality Checks
  # ---------------------------------------------------------------------------
  quality:
    name: Quality Checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-quality-checks

      - uses: ./.github/actions/run-tests
        with:
          coverage: "true"
          coverage-token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Security Audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-security-audit

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/setup-database
        with:
          operation: setup

      - name: Build application
        run: bun run build

      - uses: ./.github/actions/setup-database
        with:
          operation: remove

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact
          path: |
            dist
            .output
            public
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release (only if there are changes)
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [validate, quality, security, build]
    if: needs.validate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      - uses: ./.github/actions/setup-environment
        with:
          fetch-depth: "0"

      - uses: ./.github/actions/configure-git
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Get bump type
        id: bump_type
        run: |
          if [[ "${{ github.event.inputs.version_bump }}" != "" && "${{ github.event.inputs.version_bump }}" != "patch" ]]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> $GITHUB_OUTPUT
          else
            # Let changelogen auto-detect
            echo "type=auto" >> $GITHUB_OUTPUT
          fi

      - name: Version bump with changelogen
        run: |
          if [[ "${{ steps.bump_type.outputs.type }}" != "auto" ]]; then
            bun changelogen --bump ${{ steps.bump_type.outputs.type }}
          else
            bun changelogen --bump
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Get new version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"

      - name: Get changelog content
        id: changelog
        run: |
          # Get changelog for this release
          CHANGELOG=$(bun changelogen --output - 2>/dev/null || echo "")
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Create GitHub Release with changelogithub
        uses: antfu/changelogithub@latest
        with:
          token: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------------
  # No Release Needed
  # ---------------------------------------------------------------------------
  no_release:
    name: No Release Needed
    needs: validate
    if: needs.validate.outputs.has_changes != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify no release
        run: |
          echo "ℹ️ No changes found - skipping release"
          echo "To create a release, make conventional commits (feat:, fix:, etc.)"