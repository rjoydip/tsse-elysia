name: Release

# =============================================================================
# Release Workflow
# =============================================================================
# Triggers:
#   - Push to main branch (automatic)
#   - Manual workflow_dispatch
#
# Process:
#   1. Validate working tree (no uncommitted changes)
#   2. Run quality checks (lint, typecheck, tests)
#   3. Run security audit
#   4. Build application
#   5. Version bump with changesets
#   6. Create Git tag (vX.Y.Z)
#   7. Publish to npm (if configured)
#   8. Create GitHub Release
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publishing)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ~/.bun-install-cache

jobs:
  # ---------------------------------------------------------------------------
  # Pre-release Validations
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check_changesets.outputs.has-changesets }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: ./.github/actions/setup-environment
        with:
          fetch-depth: "0"

      - name: Check working tree status
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Working tree is not clean. Please commit or stash changes."
            git status
            exit 1
          fi
          echo "✅ Working tree is clean"

      - uses: ./.github/actions/validate-changesets
        id: check_changesets

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

  # ---------------------------------------------------------------------------
  # Quality Checks
  # ---------------------------------------------------------------------------
  quality:
    name: Quality Checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-quality-checks

      - uses: ./.github/actions/run-tests
        with:
          coverage: "true"
          coverage-token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Security Audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-security-audit

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/setup-database
        with:
          operation: setup

      - name: Build application
        run: bun run build

      - uses: ./.github/actions/setup-database
        with:
          operation: remove

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact
          path: |
            dist
            .output
            public
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release (only if there are changesets)
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [validate, quality, security, build]
    if: needs.validate.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ./.github/actions/setup-environment
        with:
          fetch-depth: "0"

      - uses: ./.github/actions/configure-git
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Version bump
        run: bun changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CHANGESET }}

      - name: Get new version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"

      - uses: ./.github/actions/commit-changes
        with:
          files: "**/*"
          commit-message: "chore: release v${{ steps.version.outputs.new_version }} [skip ci]"
          push: "true"

      - name: Create Git tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Create GitHub Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CHANGESET }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: Release v${{ steps.version.outputs.new_version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # No Release Needed
  # ---------------------------------------------------------------------------
  no_release:
    name: No Release Needed
    needs: validate
    if: needs.validate.outputs.has_changesets != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify no release
        run: |
          echo "ℹ️ No changesets found - skipping release"
          echo "To create a release, add a changeset:"
          echo "  bun changeset add"