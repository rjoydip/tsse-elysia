name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string

# =============================================================================
# Release Workflow
# =============================================================================
# Triggers:
#   - Push of version tag (e.g., v1.2.3)
#   - Manual workflow_dispatch
#
# Process:
#   1. Checkout code
#   2. Create GitHub release with changelog using changelogithub
#
# Note: NPM publishing is commented out for reference - not enabled
# =============================================================================

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # NPM Publishing (Reference Only - Not Enabled)
  # ---------------------------------------------------------------------------
  # publish-npm:
  #   name: Publish to NPM
  #   needs: build
  #   runs-on: ubuntu-latest
  #   if: github.actor != 'dependabot[bot]'
  #   permissions:
  #     id-token: write
  #     contents: read
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

  #     - name: Setup Node
  #       uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
  #       with:
  #         node-version: lts/*
  #         registry-url: https://registry.npmjs.org/

  #     - name: Install Dependencies
  #       run: bun install

  #     - name: Build
  #       run: bun run build

  #     - name: Publish to NPM
  #       run: npm publish --access public
  #       env:
  #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          fetch-depth: 0

      - name: Get Tag Name
        id: tag
        run: |
          if [[ "${{ github.event.inputs.tag }}" != "" ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Releasing: $TAG_NAME"

      - name: Get Version
        id: version
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get Changelog
        id: changelog
        run: |
          # Get changelog content using changelogen
          CHANGELOG=$(bun changelogen --output - 2>/dev/null || echo "")
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}