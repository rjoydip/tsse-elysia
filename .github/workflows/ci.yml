name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_TYPE: "sqlite"
  SQLITE_URL: "file:.artifacts/tsse-elysia.db"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-quality-checks

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-security-audit

  test:
    name: Tests & Build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            build_cmd: build
            artifact_name: server-bun
            artifact_path: dist
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/setup-database
        with:
          operation: setup

      - name: Run tests (${{ matrix.runtime }})
        run: bun test:coverage --run

      - name: Build (${{ matrix.runtime }})
        run: bun run ${{ matrix.build_cmd }}

      - name: Upload ${{ matrix.artifact_name }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 1

      - uses: ./.github/actions/setup-database
        with:
          operation: remove
        if: always()

  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-build-scan
        with:
          image-tag: tsse-elysia:${{ github.sha }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Create Release Tag (triggers on main push after CI passes)
  # ---------------------------------------------------------------------------
  create-release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    # if: github.actor != 'dependabot[bot]' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Configure Git
        uses: ./.github/actions/configure-git
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Bump Version
        id: bump
        run: |
          # Run changelogen to bump version (updates package.json and CHANGELOG.md)
          bun changelogen --bump 2>&1 || true

          # Get new version from package.json
          NEW_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")

          if [ -z "$NEW_VERSION" ]; then
            echo "No conventional commits found - skipping release"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "🚀 New version: $NEW_VERSION"
          fi

      - name: Commit Version Changes
        if: steps.bump.outputs.skip_release != 'true'
        run: |
          # Get the branch name dynamically (works for both PR merges and direct pushes)
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Pushing to branch: $BRANCH_NAME"

          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add CHANGELOG.md package.json
            git commit -m "chore: release v${{ steps.bump.outputs.new_version }}"
            git push origin "$BRANCH_NAME"
            echo "📝 Committed and pushed version changes"
          else
            echo "ℹ️ No files to commit"
          fi

      - name: Create Version Tag
        if: steps.bump.outputs.skip_release != 'true'
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "🏷️ Tag $TAG already exists, skipping tag creation"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" --force-if-needed
            echo "🏷️ Created and pushed tag: $TAG"
          fi

      - name: Skip Release Notice
        if: steps.bump.outputs.skip_release == 'true'
        run: echo "ℹ️ No conventional commits found - skipping release tag creation"