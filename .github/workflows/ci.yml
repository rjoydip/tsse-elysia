name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_TYPE: "sqlite"
  SQLITE_URL: "file:.artifacts/tsse-elysia.db"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-quality-checks

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/run-security-audit

  test:
    name: Tests & Build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            build_cmd: build
            artifact_name: server-bun
            artifact_path: dist
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/setup-database
        with:
          operation: setup

      - name: Build email templates
        run: bun run email:build

      - name: Run tests (${{ matrix.runtime }})
        run: bun test --preload ./test/setup.ts --coverage --run

      - name: Build (${{ matrix.runtime }})
        run: bun run ${{ matrix.build_cmd }}

      - name: Upload ${{ matrix.artifact_name }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 1

      - uses: ./.github/actions/setup-database
        with:
          operation: remove
        if: always()

  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for Docker file changes
        id: changed-docker
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docker:
              - 'docker/**'
              - '.trivy/**'
              - '.github/actions/docker-build-scan/**'
              - 'package.json'
              - 'bun.lock'

      - uses: ./.github/actions/docker-build-scan
        if: steps.changed-docker.outputs.docker == 'true'
        with:
          image-tag: tsse-elysia:${{ github.sha }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}