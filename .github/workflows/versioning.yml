name: Versioning

# =============================================================================
# Versioning Workflow
# =============================================================================
# Handles:
#   - PR pre-release version calculation (on push to PR)
#   - Main branch stable release (on merge)
#   - Manual version bump (workflow_dispatch)
#
# Key behaviors:
#   - PR pushes calculate version but DO NOT create releases
#   - Main merge triggers full release workflow (via release.yml)
#   - Hotfix branches get special pre-release handling
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Manual version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (skip publishing)"
        required: false
        default: false
        type: boolean

concurrency:
  group: versioning-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  GIT_TAG_PREFIX: v

jobs:
  # ---------------------------------------------------------------------------
  # PR Pre-release Version Calculation (No Release Creation)
  # ---------------------------------------------------------------------------
  pr_version:
    name: PR Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: "true"
      branch_type: ${{ steps.branch.outputs.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          fetch-depth: 0

      - name: Detect Branch Type
        id: branch
        run: |
          BRANCH=${{ github.head_ref }}
          if [[ "$BRANCH" == hotfix/* ]]; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
          else
            echo "type=feature" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Pre-release Version
        id: version
        run: |
          # Get base version from latest stable tag (exclude pre-releases)
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | grep -vE 'rc|hotfix' || echo "0.0.0")

          # Parse semver
          MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
          MINOR=$(echo $BASE_VERSION | cut -d. -f2)
          PATCH=$(echo $BASE_VERSION | cut -d. -f3)

          PR_NUMBER=${{ github.event.pull_request.number }}
          BRANCH_TYPE=${{ steps.branch.outputs.type }}

          if [[ "$BRANCH_TYPE" == "hotfix" ]]; then
            # Count existing hotfix tags for this base version
            HOTFIX_COUNT=$(git tag -l "v${MAJOR}.${MINOR}.${PATCH}-hotfix.*" | wc -l)
            VERSION="${MAJOR}.${MINOR}.${PATCH}-hotfix.$((HOTFIX_COUNT + 1))"
          else
            # Use PR number for deterministic rc version
            VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.${PR_NUMBER}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "Base version: $BASE_VERSION"
          echo "Calculated version: $VERSION"

      - name: Update package.json (PR only)
        run: |
          bun --bun npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Set PR Version Comment
        run: |
          echo "::notice::PR Version: ${{ steps.version.outputs.version }}"
          echo "This version is for display purposes only - no release will be created until merge."

  # ---------------------------------------------------------------------------
  # Main Branch Stable Release (Triggers release.yml)
  # ---------------------------------------------------------------------------
  main_release:
    name: Main Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: "false"
      should_release: ${{ steps.version.outputs.should_release }}
      bump_type: ${{ steps.bump_type.outputs.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          fetch-depth: 0

      - name: Check for Changes
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null | grep -vE 'rc|hotfix' || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            # No tags exist, check if we have commits
            COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
            if [[ "$COMMIT_COUNT" -gt "0" ]]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "No tags found, but commits exist - will create initial release"
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          COMMITS=$(git log ${LAST_TAG}..HEAD --oneline 2>/dev/null || echo "")
          if [[ -n "$COMMITS" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes found since $LAST_TAG"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes since $LAST_TAG"
          fi

      - name: Determine Bump Type
        id: bump_type
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Check manual trigger first
          if [[ "${{ github.event.inputs.version_bump }}" != "" && "${{ github.event.inputs.version_bump }}" != "patch" ]]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> $GITHUB_OUTPUT
            echo "Using manual bump: ${{ github.event.inputs.version_bump }}"
            exit 0
          fi

          # Analyze commits for automatic bump
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null | grep -vE 'rc|hotfix' || echo "v0.0.0")
          COMMITS=$(git log ${LAST_TAG}..HEAD --oneline 2>/dev/null || echo "")

          # Check for BREAKING CHANGE in commit messages
          if echo "$COMMITS" | grep -qi "BREAKING CHANGE"; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Auto-detected: major bump (BREAKING CHANGE found)"
          # Check for feat: commits (minor bump)
          elif echo "$COMMITS" | grep -qE "^(feat|feature):"; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Auto-detected: minor bump (feat: commits found)"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Auto-detected: patch bump"
          fi

      - name: Calculate New Version
        id: version
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Get base version from latest stable tag
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | grep -vE 'rc|hotfix' | sed 's/^v//' || echo "0.0.0")
          BUMP_TYPE=${{ steps.bump_type.outputs.type }}

          # Parse and bump version
          MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
          MINOR=$(echo $BASE_VERSION | cut -d. -f2)
          PATCH=$(echo $BASE_VERSION | cut -d. -f3)

          case $BUMP_TYPE in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (bump: $BUMP_TYPE)"
          echo "Base version was: $BASE_VERSION"

      - name: No Release Needed
        if: steps.changes.outputs.has_changes != 'true'
        run: |
          echo "::notice::No changes since last release - skipping release"
          echo "To create a release, make conventional commits (feat:, fix:, etc.)"

      - name: Trigger Release Workflow
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "::notice::Changes detected - triggering release.yml"
          echo "Version: ${{ steps.version.outputs.version }}, Bump: ${{ steps.bump_type.outputs.type }}"

  # ---------------------------------------------------------------------------
  # Manual Version Bump (workflow_dispatch)
  # ---------------------------------------------------------------------------
  manual_release:
    name: Manual Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: "false"
      bump_type: ${{ github.event.inputs.version_bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          fetch-depth: 0

      - name: Calculate Manual Version
        id: version
        run: |
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | grep -vE 'rc|hotfix' | sed 's/^v//' || echo "0.0.0")
          BUMP_TYPE=${{ github.event.inputs.version_bump }}

          # Parse and bump manually
          MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
          MINOR=$(echo $BASE_VERSION | cut -d. -f2)
          PATCH=$(echo $BASE_VERSION | cut -d. -f3)

          case $BUMP_TYPE in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Manual version bump: $BASE_VERSION → $NEW_VERSION ($BUMP_TYPE)"