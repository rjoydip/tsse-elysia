name: Fallow Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen

      - name: Run Fallow analysis
        uses: fallow-rs/fallow@2dc9812581490b2769f01f84c10369a19b937b28 # v2.61.0
        with:
          format: sarif
          comment: true
          annotations: true
          fail-on-issues: false

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: fallow-results.sarif
          category: fallow-analysis-${{ github.run_id }}

      - name: Create artifacts directory
        run: mkdir -p .artifacts

      - name: Generate health badge
        run: bunx fallow health --format badge > .artifacts/health-badge.svg

      - name: Publish badge to badges branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: .artifacts
          publish_branch: badges
          keep_files: true
          include_files: health-badge.svg