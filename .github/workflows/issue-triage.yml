name: Issue Triage

# Required GitHub Secrets (set in repository settings -> Secrets and variables -> Actions):
#   OPENCODE_MODEL - Model for OpenCode (fallback: anthropic/claude-sonnet-4-20250514)

on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.result == 'true'
        with:
          submodules: false

      - name: Configure Git
        if: steps.check.outputs.result == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Disable submodules
        if: steps.check.outputs.result == 'true'
        run: |
          git config --global submodule.recurse false
          git config --global fetch.recurseSubmodules false
          git config --global status.submoduleSummary false

      - uses: anomalyco/opencode/github@3c85719fea0ee83389c814d7abbf1f98c5c6f0f1 # v1.14.25
        if: steps.check.outputs.result == 'true'
        timeout-minutes: 10
        with:
          share: true
          use_github_token: true
          model: ${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.