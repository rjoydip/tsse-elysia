name: Issue Triage

# Required GitHub Secrets (set in repository settings -> Secrets and variables -> Actions):
#   OPENCODE_MODEL - Model for OpenCode (fallback: anthropic/claude-sonnet-4-20250514)

on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.result == 'true'
        with:
          submodules: false

      - name: Configure Git
        if: steps.check.outputs.result == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Disable submodules
        if: steps.check.outputs.result == 'true'
        run: |
          git config --global submodule.recurse false
          git config --global fetch.recurseSubmodules false
          git config --global status.submoduleSummary false

      - uses: anomalyco/opencode/github@eb4219304358a9b70aa73a61433f8de2eb9e5c95 # v1.14.30
        if: steps.check.outputs.result == 'true'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          share: true
          use_github_token: true
          model: ${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}
          prompt: |
            You are an expert issue triage assistant. Analyze this GitHub issue and provide actionable guidance.

            ## Your Task

            Based on the issue description, provide:

            ### 1. Issue Classification

            - **Type**: bug, feature request, documentation, question, or enhancement
            - **Priority**: critical, high, medium, or low
            - **Complexity**: simple (1-2 hours), moderate (half-day), or complex (multi-day)

            ### 2. Immediate Actions

            If the issue is clear and actionable:

            - Provide relevant documentation links
            - Suggest code patterns or examples
            - Add error handling guidance if applicable

            ### 3. Clarification Needed

            If the issue lacks details:

            - List specific questions to ask the reporter
            - Suggest what additional context would help

            ### 4. Related Resources

            - Link to similar issues or PRs in this repo
            - Relevant documentation URLs
            - Code references if applicable

            ## Guidelines

            - Be concise and actionable
            - Only comment if you can add value
            - For spam/low-quality issues: just react with 👎 (no comment)
            - For clear bugs: provide fix guidance
            - For feature requests: discuss feasibility and alternatives
            - Always be helpful and constructive