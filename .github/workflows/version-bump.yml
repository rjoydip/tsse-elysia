name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Manual version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.title != ''))
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      bump_type: ${{ steps.bump.outputs.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          fetch-depth: 0

      - name: Detect version bump type
        id: bump
        run: |
          # For manual workflow_dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> $GITHUB_OUTPUT
            echo "🔧 Manual version bump: ${{ github.event.inputs.version_bump }}"
            exit 0
          fi

          # For merged PRs, analyze from PR title
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Analyzing PR title: $PR_TITLE"

          # Check for BREAKING CHANGE
          if echo "$PR_TITLE" | grep -qi "BREAKING CHANGE"; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "🔴 Breaking change detected - major version bump"
          # Check for feat: commits (minor bump)
          elif echo "$PR_TITLE" | grep -qE "^(feat|feature)(\(.+\))?!?: .+"; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "🟢 New feature - minor version bump"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "🟡 Other change - patch version bump"
          fi

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: version
        run: |
          CURRENT="${{ steps.current_version.outputs.current_version }}"
          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          # Parse current version
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Remove 'v' prefix if present
          MAJOR=$(echo "$MAJOR" | sed 's/^v//')

          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              echo "🚀 Major version bump: $CURRENT → $NEW_VERSION"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              echo "🚀 Minor version bump: $CURRENT → $NEW_VERSION"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "🚀 Patch version bump: $CURRENT → $NEW_VERSION"
              ;;
            *)
              NEW_VERSION="$CURRENT"
              echo "⚠️ No version bump needed"
              ;;
          esac

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          node -e "const pkg=require('./package.json');pkg.version='$NEW_VERSION';require('fs').writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n')"
          echo "📝 Updated package.json to $NEW_VERSION"

      - name: Create version commit
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.new_version }}"
          file_pattern: "package.json"
          push: true

      - name: Create version tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Version v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"
          echo "🏷️ Created tag v${{ steps.version.outputs.new_version }}"

      - name: Output version
        run: |
          echo "::notice::Version bumped to v${{ steps.version.outputs.new_version }} (${{ steps.bump.outputs.type }} bump)"

  skip-version:
    name: Skip Version Bump
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !(github.event.pull_request.merged == true && github.event.pull_request.title != '')
    steps:
      - name: No version bump needed
        run: echo "ℹ️ PR not merged or no title - skipping version bump"