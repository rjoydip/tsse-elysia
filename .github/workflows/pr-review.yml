name: PR Review

# Required GitHub Secrets (set in repository settings -> Secrets and variables -> Actions):
#   OPENCODE_MODEL - Model for OpenCode (fallback: opencode/minimax-m2.5-free)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: >
      github.actor != 'dependabot[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         (startsWith(github.event.comment.body, '/oc') ||
          startsWith(github.event.comment.body, '/opencode')))
      )
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Disable submodules
        run: |
          git config --global submodule.recurse false
          git config --global fetch.recurseSubmodules false
          git config --global status.submoduleSummary false

      - name: Load PR review prompt
        run: |
          {
            echo "PR_REVIEW_PROMPT<<EOF"
            cat knowledge/prompts/pr-review.md
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Run Code Review
        uses: anomalyco/opencode/github@3c85719fea0ee83389c814d7abbf1f98c5c6f0f1 # v1.14.25
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          share: true
          use_github_token: true
          model: ${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}
          prompt: ${{ env.PR_REVIEW_PROMPT }}
