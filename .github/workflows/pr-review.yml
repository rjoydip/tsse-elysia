name: pr-review

# Required GitHub Secrets (set in repository settings -> Secrets and variables -> Actions):
#   GH_USER_EMAIL  - Email for git config (fallback: github-actions[bot]@users.noreply.github.com)
#   GH_USER_NAME   - Name for git config (fallback: github-actions[bot])
#   OPENCODE_MODEL - Model for OpenCode (fallback: opencode/minimax-m2.5-free)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: >
      github.actor != 'dependabot[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         startsWith(github.event.comment.body, '/oc') ||
         startsWith(github.event.comment.body, '/opencode'))
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Configure Git
        run: |
          git config --global user.email "${{ secrets.GH_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config --global user.name "${{ secrets.GH_USER_NAME || 'github-actions[bot]' }}"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Load Review Prompt
        id: prompt
        run: |
          PROMPT_FILE="./knowledge/prompts/review-pr.md"

          if [ ! -f "$PROMPT_FILE" ]; then
            echo "❌ Prompt file not found: $PROMPT_FILE"
            exit 1
          fi

          echo "✅ Using prompt file: $PROMPT_FILE"
          cp "$PROMPT_FILE" /tmp/review-prompt.txt

      - name: Generate Branch Diff
        id: diff
        run: |
          # Guard against undefined pull_request in issue_comment events
          BASE_REF="${{ github.event.pull_request.base.ref || github.event.issue.pull_request.base.ref }}"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.issue.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.event.issue.pull_request.head.sha }}"

          # Fetch base ref with sufficient history
          git fetch origin "${BASE_REF}" --depth=100

          # Try merge-base diff first, fall back to direct diff
          if git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null; then
            git diff "${BASE_SHA}...${HEAD_SHA}" > /tmp/branch.diff
          elif git merge-base --is-ancestor "$HEAD_SHA" "$BASE_SHA" 2>/dev/null; then
            # Base is newer - show what changed from head to base
            git diff "${HEAD_SHA}...${BASE_SHA}" > /tmp/branch.diff
          else
            # No ancestor relationship - use direct diff
            git diff "${BASE_SHA}" "${HEAD_SHA}" > /tmp/branch.diff
          fi

          echo "diff_size=$(wc -c < /tmp/branch.diff)" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode
        if: ${{ !github.event.pull_request.merged }}
        run: bun install -g opencode-ai

      - name: Run Code Review
        if: ${{ !github.event.pull_request.merged }}
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}
        run: |
          # Guard against undefined pull_request - use fallback SHA
          REVIEW_SHA="${{ github.event.pull_request.head.sha || github.event.issue.pull_request.head.sha || github.sha }}"

          # Append diff section header + actual diff to the prompt
          cat >> /tmp/review-prompt.txt << 'EOF'

          ---

          ## Diff to Review

          EOF

          cat /tmp/branch.diff >> /tmp/review-prompt.txt

          # Run OpenCode and capture raw output
          opencode run "$(cat /tmp/review-prompt.txt)" \
            --model "$OPENCODE_MODEL" \
            --dir . \
            --share \
            --pure \
            --title "review-${REVIEW_SHA}" \
            > /tmp/review-raw.txt 2>&1 || true

          # Strip ANSI escape codes and OpenCode status lines
          sed -e 's/\x1B\[[0-9;]*[mGKHF]//g' \
              -e 's/\x1B\[[0-9;]*[A-Z]//g' \
              -e '/^Performing one time database migration/d' \
              -e '/^sqlite-migration:done/d' \
              -e '/^Database migration complete/d' \
              -e '/^build · /d' \
              -e '/^~ https:\/\/opncd\.ai\//d' \
              -e '/^\s*$/N;/^\n\s*$/d' \
              /tmp/review-raw.txt > /tmp/review-output.txt

          echo "Review output:"
          cat /tmp/review-output.txt

      - name: Post Review as PR Comment
        if: ${{ !github.event.pull_request.merged && !github.event.issue.pull_request.merged }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          REPO="${{ github.repository }}"

          # Guard against undefined SHA
          REVIEW_SHA="${{ github.event.pull_request.head.sha || github.event.issue.pull_request.head.sha || github.sha }}"

          # Build comment body - heredoc content must be at column 0 (GitHub renders leading spaces as code blocks)
          cat > /tmp/comment-body.md << 'HEADER'
          ## 🤖 Automated Code Review
          HEADER

          cat >> /tmp/comment-body.md << EOF

          > 📝 Reviewed commit: \`${REVIEW_SHA}\`
          > 🤖 Model: \`${{ vars.OPENCODE_MODEL || 'opencode/minimax-m2.5-free' }}\`

          ---

          EOF

          # Append the review output directly (preserves all markdown as-is)
          cat /tmp/review-output.txt >> /tmp/comment-body.md

          # Delete any previous bot review comment (so only one comment exists per PR)
          EXISTING_COMMENT_ID=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## 🤖 Automated Code Review")))] | last | .id // empty')

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}"
            echo "Deleted previous review comment: $EXISTING_COMMENT_ID"
          fi

          # Post fresh review comment — read body from file to avoid shell escaping issues
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --rawfile body /tmp/comment-body.md '{"body": $body}')"

          echo "Review posted to PR #${PR_NUMBER}"