name: E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_TYPE: "sqlite"
  SQLITE_URL: "file:.artifacts/tsse-elysia.db"
  E2E_HOST: "0.0.0.0"
  E2E_PORT: "4173"

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-environment

      - uses: ./.github/actions/setup-database
        with:
          operation: setup

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Resolve host IP
        run: |
          HOST_IP=$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}')
          echo "E2E_HOST=$HOST_IP" >> $GITHUB_ENV
          echo "E2E_BASE_URL=http://$HOST_IP:$E2E_PORT" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://$HOST_IP:$E2E_PORT/api/auth" >> $GITHUB_ENV
          echo "Resolved host IP: $HOST_IP"

      - name: Start preview server
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          bun run preview --port $E2E_PORT --host $E2E_HOST &
          for i in $(seq 1 30); do
            if curl -sf http://$E2E_HOST:$E2E_PORT > /dev/null 2>&1; then
              echo "Server http://$E2E_HOST:$E2E_PORT is ready"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Run E2E tests
        run: bun test:e2e

      - name: Stop preview server
        if: always()
        run: pkill -f "bun run preview" || true

      - uses: ./.github/actions/setup-database
        with:
          operation: remove
        if: always()