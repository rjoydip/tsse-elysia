"$schema" = "https://raw.githubusercontent.com/fallow-rs/fallow/main/schema.json"

ignorePatterns = [
  "**/*.{generated,d}.ts",
  "**/dist/**",
  "**/.{artifacts,opencode}/**",
  "k6.config.js",
]
ignoreDependencies = ["ioredis", "portless"]
dynamicallyLoaded = ["src/**/*.{ts,tsx}"]

[rules]
"unused-files" = "warn"
"unused-exports" = "warn"
"unused-types" = "warn"
"unresolved-imports" = "error"
"circular-dependency" = "warn"

[duplicates]
mode = "mild"
minTokens = 50
minLines = 5
threshold = 0

[health]
maxCyclomatic = 20
maxCognitive = 15