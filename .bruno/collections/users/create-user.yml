info:
  name: Create User
  type: http
  seq: 4
  tags:
    - smoke
    - users
    - admin

http:
  method: POST
  url: "{{base_url}}/users"
  body:
    type: json
    data: |-
      {
        "name": "Test User",
        "email": "test-{{$isoTimestamp}}@example.com",
        "password": "Test123!@#"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Extract created user ID for downstream requests (e.g., get-user.yml)
        if (res.body && res.body.id) {
          bru.setVar("user_id", res.body.id);
        }
    - type: tests
      code: |-
        test("status is 201", () => expect(res.status).to.equal(201));

settings:
  encodeUrl: true