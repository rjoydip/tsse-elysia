info:
  name: Get Current User
  type: http
  seq: 2
  tags:
    - smoke
    - users

http:
  method: GET
  url: "{{base_url}}/users/me"
  auth:
    type: bearer
    token: "{{session_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", () => expect(res.status).to.equal(200));
        test("has user data", () => expect(res.body).to.have.property("id"));

settings:
  encodeUrl: true