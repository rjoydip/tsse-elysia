  url: "{{base_url}}/settings/profile"
  auth:
    type: bearer
    token: "{{session_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true